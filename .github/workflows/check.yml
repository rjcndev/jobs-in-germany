name: check

# Runs the repo integrity checks on every push and pull request.
# The path .github/workflows is read by both GitHub Actions and Gitea Actions,
# so this file works on either host without modification.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: make check
        run: make check
