<!-- Light/dark switch for rjcn.dev.
     Add to the site's <head> on every page, for example with the WPCode plugin
     (Code Snippets → Header & Footer → Header). The styles live in
     scripts/wordpress.css. Without a saved choice the site follows the
     visitor's system setting; clicking the switch saves an explicit one. -->
<script>
(function () {
  var root = document.documentElement;
  var media = window.matchMedia('(prefers-color-scheme: dark)');
  var saved = null;
  try { saved = localStorage.getItem('rjcn-theme'); } catch (e) {}

  function effective() {
    return saved || (media.matches ? 'dark' : 'light');
  }
  function apply() {
    if (saved) root.setAttribute('data-theme', saved);
    else root.removeAttribute('data-theme');
    root.setAttribute('data-theme-effective', effective());
    var buttons = document.querySelectorAll('.jig-theme-toggle');
    for (var i = 0; i < buttons.length; i++) {
      var dark = effective() === 'dark';
      buttons[i].setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      buttons[i].setAttribute('title', dark ? 'Light mode' : 'Dark mode');
    }
  }
  apply();  // runs in <head>, before the page draws, so there is no flash
  if (media.addEventListener) media.addEventListener('change', apply);

  var icons =
    '<svg class="jig-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>' +
    '<svg class="jig-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  document.addEventListener('DOMContentLoaded', function () {
    // Kadence has a right-hand section in both the desktop and the mobile header.
    var slots = document.querySelectorAll('#main-header .site-header-main-section-right, #mobile-header .site-header-main-section-right');
    for (var i = 0; i < slots.length; i++) {
      if (slots[i].querySelector('.jig-theme-toggle')) continue;  // snippet included twice
      var item = document.createElement('div');
      item.className = 'site-header-item jig-theme-item';
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'jig-theme-toggle';
      button.innerHTML = icons;
      button.addEventListener('click', function () {
        saved = effective() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('rjcn-theme', saved); } catch (e) {}
        apply();
      });
      item.appendChild(button);
      // Desktop: after the menu, at the far right. Mobile: before the menu button.
      if (slots[i].closest('#mobile-header')) slots[i].insertBefore(item, slots[i].firstChild);
      else slots[i].appendChild(item);
    }
    apply();
  });
})();
</script>
